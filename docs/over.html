<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dogma · Over de app</title>
<script>
  /* GitHub Pages-kopie → het enige officiële adres (zie index.html) */
  if (location.hostname.endsWith('github.io')) location.replace('https://dogma-bio.web.app/docs/over.html' + location.search + location.hash);
</script>
<link rel="icon" href="../shared/icons/logo-16.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  body { line-height: 1.55; background: var(--bg); }
  #mapHost { --cmap-bg: var(--bg); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 22px; }
  nav.top { display: flex; align-items: center; gap: 14px; padding: 16px 0; }
  nav.top .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 18px; }
  nav.top .brand img { width: 32px; height: 32px; border-radius: 8px; }
  nav.top .sp { flex: 1; }
  nav.top a.nl { color: var(--muted); text-decoration: none; font-size: 14px; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); }
  nav.top a.nl:hover { color: var(--text); border-color: var(--accent); }
  .btn { all: unset; cursor: pointer; font: 600 12px var(--mono); padding: 6px 9px; border-radius: 7px; border: 1px solid var(--line); color: var(--muted); }
  .btn[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: rgba(124,196,255,.12); }
  header.hero { padding: 26px 0 8px; }
  .eyebrow { font: 600 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: clamp(30px, 4vw, 44px); line-height: 1.12; margin: 12px 0 10px; letter-spacing: -.02em; }
  .lead { color: var(--muted); max-width: 820px; font-size: 17px; margin: 0; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 6px; }
  .stats div { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--bg-2); min-width: 120px; }
  .stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 12.5px; color: var(--muted); }

  .tabs { position: sticky; top: 0; z-index: 5; background: rgba(7,11,22,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); margin-top: 18px; }
  .tabs .wrap { display: flex; gap: 4px; overflow-x: auto; }
  .tabs button { all: unset; cursor: pointer; white-space: nowrap; font-size: 15px; font-weight: 600; padding: 14px 14px 12px; color: var(--muted); border-bottom: 3px solid transparent; }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .tabs button:hover { color: var(--text); }
  .tabs button:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main section[role="tabpanel"] { padding: 30px 0 60px; }
  main section[hidden] { display: none; }
  h2 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.01em; }
  h3 { font-size: 18px; margin: 26px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 20px; max-width: 860px; }
  p { max-width: 900px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
  .card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .card h4 { margin: 0 0 6px; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
  .card h4 .ic { font-size: 18px; }
  .card p, .card li { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .card ul { margin: 6px 0 0; padding-left: 18px; }
  .card b, .card kbd { color: var(--text); }
  kbd { font: 600 12px var(--mono); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); background: rgba(255,255,255,.05); }

  details.acc { border: 1px solid var(--line); border-radius: 14px; background: var(--bg-2); margin: 0 0 10px; }
  details.acc > summary { cursor: pointer; list-style: none; padding: 15px 18px; font-weight: 600; font-size: 16px; display: flex; gap: 10px; align-items: baseline; }
  details.acc > summary::-webkit-details-marker { display: none; }
  details.acc > summary::before { content: "▸"; color: var(--accent); transition: transform .15s; display: inline-block; }
  details.acc[open] > summary::before { transform: rotate(90deg); }
  details.acc > summary small { font-weight: 400; color: var(--muted); font-size: 13.5px; }
  details.acc > .in { padding: 0 18px 18px 38px; }
  details.acc > .in p, details.acc > .in li { color: #c3cbdc; font-size: 14.5px; }
  details.acc > .in ul, details.acc > .in ol { padding-left: 20px; max-width: 900px; }
  details.acc > .in li { margin: 5px 0; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  td small { color: var(--muted); }
  .tscroll { overflow-x: auto; }
  .pill { display: inline-block; font: 600 11px/1 var(--mono); padding: 4px 7px; border-radius: 6px; background: rgba(124,196,255,.12); color: var(--accent); margin: 0 4px 3px 0; white-space: nowrap; }
  .pill.g { background: rgba(127,220,106,.13); color: #7fdc6a; }
  .pill.r { background: rgba(255,107,107,.13); color: #ff8f8f; }
  .pill.y { background: rgba(255,194,71,.13); color: #ffc247; }
  .ex { margin: 6px 0 0; padding-left: 18px; }
  .ex li { font-size: 13.5px; color: var(--muted); margin: 3px 0; }

  .steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; max-width: 980px; }
  .steps li { counter-increment: s; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px 13px 56px; position: relative; font-size: 14.5px; color: #c3cbdc; }
  .steps li b { color: var(--text); }
  .steps li::before { content: counter(s); position: absolute; left: 16px; top: 12px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(124,196,255,.14); color: var(--accent); display: grid; place-items: center; font: 600 13px var(--mono); }

  .tiers { display: grid; gap: 10px; max-width: 980px; }
  .tier { display: grid; grid-template-columns: 150px 1fr; gap: 14px; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; background: var(--bg-2); }
  .tier .lv { font-weight: 700; font-size: 14px; }
  .tier .lv small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
  .tier p { margin: 0; font-size: 14px; color: #c3cbdc; }
  .tier.no { border-color: rgba(255,107,107,.35); }
  @media (max-width: 700px) { .tier { grid-template-columns: 1fr; } }

  .srctools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 12px; }
  .srctools input { flex: 1 1 280px; max-width: 460px; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 14px; }
  .srctools .f { all: unset; cursor: pointer; font-size: 13px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .srctools .f[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: rgba(124,196,255,.12); }
  .srctools .n { font-size: 13px; color: var(--muted); margin-left: auto; }
  ol.srcs { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }
  ol.srcs li { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--bg); font-size: 14px; }
  ol.srcs li a.t { color: var(--text); text-decoration: none; }
  ol.srcs li a.t:hover { color: var(--accent); text-decoration: underline; }
  ol.srcs .use { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
  ol.srcs .use a { font-size: 12px; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.05); color: var(--muted); text-decoration: none; }
  ol.srcs .use a:hover { color: var(--text); background: rgba(124,196,255,.14); }
  .more { all: unset; cursor: pointer; color: var(--accent); font-size: 14px; margin-top: 10px; display: inline-block; }

  .sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .sw div { border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 13.5px; background: var(--bg-2); }
  .sw div i { display: block; height: 24px; border-radius: 6px; margin-bottom: 8px; }
  .moves { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 6px 0 4px; }
  .moves div { border-radius: 14px; padding: 14px 16px; border: 1px solid var(--line); background: var(--bg-2); border-top: 3px solid var(--c); }
  .moves b { display: block; font-size: 15px; margin-bottom: 4px; }
  .moves span { font-size: 14px; color: var(--muted); }
  footer { padding: 26px 0 50px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
  footer a { color: var(--muted); }
  #loading { padding: 40px 0; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top">
    <a class="brand" href="../index.html"><img src="../shared/icons/logo.svg" alt=""><span>Dogma</span></a>
    <span class="sp"></span>
    <a class="nl" href="../index.html" id="navHome"></a>
    <a class="nl" href="../atlas/index.html" id="navAtlas"></a>
    <span id="langBox"></span>
  </nav>
  <header class="hero">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
    <div class="stats" id="stats"></div>
  </header>
</div>
<div class="tabs"><div class="wrap" role="tablist" id="tabs"></div></div>
<main class="wrap" id="main"><p id="loading">…</p></main>
<footer class="wrap" id="foot"></footer>
<script>
  /* online (Firebase): één gebundeld bestand; lokaal: losse modules (zie tools/bundle.mjs) */
  const online = location.hostname.endsWith('.web.app');
  import(online ? './over.bundle.js' : './over.js');
</script>
</body>
</html>
