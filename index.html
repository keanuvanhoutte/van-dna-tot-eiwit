  h1t: { nl: 'Kies een verhaal of zoek', en: 'Pick a story or search' },
  h1p: { nl: 'Begin met een hoofdverhaal of een zijpad, of typ in de zoekbalk wat je wil zien.', en: 'Start with a main story or a side path, or type what you want to see in the search bar.' },
  h2t: { nl: 'Klik op wat oplicht', en: 'Click what lights up' },
  h2p: { nl: 'Elk onderdeel dat oplicht, opent een korte animatie met uitleg.', en: 'Every part that lights up opens a short animation with an explanation.' },
  h3t: { nl: 'Verdwaald? Kijk bovenaan', en: 'Lost? Look at the top' },
  h3p: { nl: 'Daar zie je altijd in welk verhaal en hoofdstuk je zit. Uitzoomen brengt je terug naar de hele cel, Startmenu naar deze pagina.', en: 'There you always see which story and chapter you are in. Zoom out takes you back to the whole cell, Main menu to this page.' },
  archT: { nl: 'Archief (goedgekeurde proofs of concept):', en: 'Archive (approved proofs of concept):' },
  c3l: { nl: 'Over de app · bronnen en wetenschappelijke borging', en: 'About the app · sources and scientific quality' },
  foot: { nl: 'De inhoud is in controlerondes nagekeken tegen wetenschappelijke bronnen; die staan bij elke uitleg.', en: 'The content was checked against scientific sources in verification rounds; they are listed with every explanation.' },
};
for (const [id, v] of Object.entries(T)) { const el = document.getElementById(id); if (el) el.textContent = L(v); }
document.title = L({ nl: 'Dogma · van DNA tot eiwit', en: 'Dogma · from DNA to protein' });

const ch = { nl: 'hoofdstukken', en: 'chapters' };
const nt = id => NODES[id] ? (lang === 'en' ? NODES[id].en : NODES[id].t) : id;
/* aantal hoofdstukken/vormen als tooltip op de ingangen (rechtstreeks uit de inhoud) */
const tip = (sel, n, unit) => { document.querySelector(sel).title = `${n} ${L(unit)}`; };
tip('a.story.s1', LINES.virus.chapters.length, ch); tip('a.story.s2', LINES.signaal.chapters.length, ch);
tip('a.door[href*="bacterie"]', LINES.bacterie.chapters.length, ch); tip('a.door[href^="atlas"]', ENTRIES.length, { nl: 'vormen', en: 'shapes' });
/* zijpaden: begin → midden → einde, en waar het aansluit op verhaal 1 */
for (const a of document.querySelectorAll('a.side[data-line]')) {
  const l = LINES[a.dataset.line]; if (!l) continue;
  const c = l.chapters;
  a.querySelector('.rt').innerHTML = `<b>${L({ nl: 'Route', en: 'Route' })}</b>${nt(c[0].id)} → ${nt(c[Math.floor(c.length / 2)].id)} → ${nt(c[c.length - 1].id)}`;
  /* waar sluit het zijpad aan: eerst verhaal 1, anders het eerste hoofdverhaal dat dat hoofdstuk bevat (bv. de bacterie) */
  const host = ['virus', ...Object.keys(LINES).filter(k => k !== 'virus' && !LINES[k].side)].find(k => LINES[k].chapters.some(x => x.id === l.from));
  const ci = host ? LINES[host].chapters.findIndex(x => x.id === l.from) : -1;
  if (ci >= 0) a.querySelector('.fr').innerHTML = `${L({ nl: 'Sluit aan bij', en: 'Joins' })} <b>${L(LINES[host].short)} · ${L({ nl: 'hoofdstuk', en: 'chapter' })} ${ci + 1}</b> (${nt(l.from)})`;
  a.querySelector('.n').textContent = `${c.length} ${L(ch)} →`;
}
/* zoeken op de startpagina: de uitgebreide uitleg pas laden bij het eerste gebruik */
mountSearch(document.getElementById('homeSearch'), {
  engine: async () => { const [{ DETAILS }, { STEP_TAGS }] = await Promise.all([import('./shared/details/index.js'), import('./shared/steptags.js')]); return makeSearch({ NODES, LINES, LINKS, DETAILS, S_EN, STEPS: STEP_TAGS }); },
  NODES, LINES, L, title: n => (lang === 'en' ? n.en : n.t), summary: n => (lang === 'en' ? S_EN[n.id] ?? n.s : n.s),
  onPick: r => { location.href = `app/index.html?scene=${encodeURIComponent(r.id)}&story=${r.loc.line}${r.step !== null && r.step !== undefined ? `&step=${r.step}` : ''}`; },
  atlasHref: qv => `atlas/index.html?find=${encodeURIComponent(qv)}`,
});
document.querySelector('#homeSearch input')?.setAttribute('placeholder', L({ nl: 'Zoek bv. ribosoom, kanker, splicing', en: 'Search e.g. ribosome, cancer, splicing' }));
document.getElementById('langBox').append(langSwitch('btn'));
document.getElementById('home').hidden = false;

/* ---- niveau (moeilijkheidsgraad): keuzelijst bovenaan, bewaard op dit toestel; laatste optie = uitleg per niveau ---- */
document.getElementById('lvlLbl').textContent = L({ nl: 'Niveau', en: 'Level' });
levelSelect(document.getElementById('lvlSel'));

/* ---- draaiende dubbele helix (canvas, licht; stilstaand bij 'minder beweging') ---- */
const cv = document.getElementById('helix'), ctx = cv.getContext('2d');
const BASE = { A: '#7fdc6a', T: '#ff6b6b', G: '#ffc247', C: '#4f8ff7' };
const PAIR = { A: 'T', T: 'A', G: 'C', C: 'G' };
const SEQ = 'ATGCGTACCGATTGCAGCTTAGGCATCGATGC';
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, dpr = 1;
function size() { dpr = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; }
new ResizeObserver(() => { size(); if (still) draw(0); }).observe(cv);
size();
function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(1.2);
  const n = SEQ.length, len = Math.hypot(W, H) * 0.95, step = len / n, R = Math.min(W, H) * 0.2;
  const items = [];
  for (let i = 0; i < n; i++) {
    const y = -len / 2 + i * step, a = i * 0.6 + t * 0.00045;
    const a2 = a + 2.4;                       // kleine en grote groef: strengen niet precies tegenover elkaar
    const p1 = { x: Math.cos(a) * R, z: Math.sin(a) }, p2 = { x: Math.cos(a2) * R, z: Math.sin(a2) };
    items.push({ kind: 'rung', y, p1, p2, b: SEQ[i], z: (p1.z + p2.z) / 2 });
    items.push({ kind: 'bb', y, p: p1, col: '#4f8ff7', z: p1.z });
    items.push({ kind: 'bb', y, p: p2, col: '#ff8a3d', z: p2.z });
  }
  // ruggengraat als vloeiende lijn (achteraan eerst)
  for (const [k, col] of [[0, '#4f8ff7'], [1, '#ff8a3d']]) {
    ctx.beginPath();
    for (let i = 0; i <= n * 4; i++) {
      const f = i / 4, y = -len / 2 + f * step, a = f * 0.6 + t * 0.00045 + (k ? 2.4 : 0);
      const x = Math.cos(a) * R; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.strokeStyle = col; ctx.globalAlpha = .28; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1;
  }
  items.sort((a, b) => a.z - b.z);
  for (const it of items) {
    const depth = (it.z + 1) / 2, alpha = .25 + .75 * depth;
    if (it.kind === 'rung') {
      const mx = (it.p1.x + it.p2.x) / 2;
      ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.globalAlpha = alpha * .9;
      ctx.strokeStyle = BASE[it.b]; ctx.beginPath(); ctx.moveTo(it.p1.x, it.y); ctx.lineTo(mx, it.y); ctx.stroke();
      ctx.strokeStyle = BASE[PAIR[it.b]]; ctx.beginPath(); ctx.moveTo(mx, it.y); ctx.lineTo(it.p2.x, it.y); ctx.stroke();
    } else {
      const r = 5 + 4 * depth;
      const g = ctx.createRadialGradient(it.p.x - r / 3, it.y - r / 3, 1, it.p.x, it.y, r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(.35, it.col); g.addColorStop(1, '#0a1224');
      ctx.globalAlpha = alpha; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(it.p.x, it.y, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1; ctx.restore();
}
if (still) draw(0);
else { const loop = t => { draw(t); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
