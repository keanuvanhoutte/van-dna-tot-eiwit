  foot: { nl: 'Alle inhoud is nagekeken tegen wetenschappelijke bronnen; die staan bij elke uitleg.', en: 'All content is checked against scientific sources; they are listed with every explanation.' },
};
const HTML = new Set(['tag1', 'tag2', 'tag3']);
for (const [id, v] of Object.entries(T)) { const el = document.getElementById(id); if (el) el[HTML.has(id) ? 'innerHTML' : 'textContent'] = L(v); }
document.title = L(T.brand);

// cijfers rechtstreeks uit de inhoud (blijven juist als er scènes bijkomen)
const nodes = Object.values(NODES);
const pdb = new Set([...nodes.flatMap(n => n.pdb ?? []), ...ENTRIES.map(e => e.pdb).filter(Boolean)].map(s => String(s).toUpperCase()));
const count = (id, n) => { document.getElementById(id).textContent = n; };
count('nScenes', nodes.length);
count('nPdb', pdb.size);
count('nLines', Object.keys(LINES).length);
const ch = { nl: 'hoofdstukken', en: 'chapters' };
document.getElementById('c0m').innerHTML = `<b>${new Set([...LINES.virus.chapters, ...LINES.signaal.chapters].map(c => c.id)).size}</b> ${L(ch)} · ${L({ nl: '2 verhalen', en: '2 stories' })}`;
document.getElementById('c1m').innerHTML = `<b>${LINES.bacterie.chapters.length}</b> ${L(ch)}`;
document.getElementById('c2m').innerHTML = `<b>${ENTRIES.length}</b> ${L({ nl: 'structuren + zoeken in de PDB', en: 'structures + PDB search' })}`;
for (const a of document.querySelectorAll('a.side[data-line]')) { const l = LINES[a.dataset.line]; if (l) a.querySelector('.n').textContent = `${l.chapters.length} ${L(ch)} →`; }
document.getElementById('langBox').append(langSwitch('btn'));
document.getElementById('home').hidden = false;

/* ---- draaiende dubbele helix (canvas, licht; stilstaand bij 'minder beweging') ---- */
const cv = document.getElementById('helix'), ctx = cv.getContext('2d');
const BASE = { A: '#7fdc6a', T: '#ff6b6b', G: '#ffc247', C: '#4f8ff7' };
const PAIR = { A: 'T', T: 'A', G: 'C', C: 'G' };
const SEQ = 'ATGCGTACCGATTGCAGCTTAGGCATCGATGC';
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, dpr = 1;
function size() { dpr = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; }
new ResizeObserver(() => { size(); if (still) draw(0); }).observe(cv);
size();
function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-0.38);
  const n = SEQ.length, len = Math.hypot(W, H) * 0.78, step = len / n, R = Math.min(W, H) * 0.16;
  const items = [];
  for (let i = 0; i < n; i++) {
    const y = -len / 2 + i * step, a = i * 0.6 + t * 0.00045;
    const a2 = a + 2.4;                       // kleine en grote groef: strengen niet precies tegenover elkaar
    const p1 = { x: Math.cos(a) * R, z: Math.sin(a) }, p2 = { x: Math.cos(a2) * R, z: Math.sin(a2) };
    items.push({ kind: 'rung', y, p1, p2, b: SEQ[i], z: (p1.z + p2.z) / 2 });
    items.push({ kind: 'bb', y, p: p1, col: '#4f8ff7', z: p1.z });
    items.push({ kind: 'bb', y, p: p2, col: '#ff8a3d', z: p2.z });
  }
  // ruggengraat als vloeiende lijn (achteraan eerst)
  for (const [k, col] of [[0, '#4f8ff7'], [1, '#ff8a3d']]) {
    ctx.beginPath();
    for (let i = 0; i <= n * 4; i++) {
      const f = i / 4, y = -len / 2 + f * step, a = f * 0.6 + t * 0.00045 + (k ? 2.4 : 0);
      const x = Math.cos(a) * R; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.strokeStyle = col; ctx.globalAlpha = .28; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1;
  }
  items.sort((a, b) => a.z - b.z);
  for (const it of items) {
    const depth = (it.z + 1) / 2, alpha = .25 + .75 * depth;
    if (it.kind === 'rung') {
      const mx = (it.p1.x + it.p2.x) / 2;
      ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.globalAlpha = alpha * .9;
      ctx.strokeStyle = BASE[it.b]; ctx.beginPath(); ctx.moveTo(it.p1.x, it.y); ctx.lineTo(mx, it.y); ctx.stroke();
      ctx.strokeStyle = BASE[PAIR[it.b]]; ctx.beginPath(); ctx.moveTo(mx, it.y); ctx.lineTo(it.p2.x, it.y); ctx.stroke();
    } else {
      const r = 5 + 4 * depth;
      const g = ctx.createRadialGradient(it.p.x - r / 3, it.y - r / 3, 1, it.p.x, it.y, r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(.35, it.col); g.addColorStop(1, '#0a1224');
      ctx.globalAlpha = alpha; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(it.p.x, it.y, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1; ctx.restore();
}
if (still) draw(0);
else { const loop = t => { draw(t); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
</body>
