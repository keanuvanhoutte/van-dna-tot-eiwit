<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Van DNA tot eiwit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/theme.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 40px 16px;
    background: radial-gradient(900px 500px at 20% 0%, rgba(79,143,247,.16), transparent 60%), radial-gradient(700px 400px at 90% 100%, rgba(255,138,61,.1), transparent 60%), var(--bg); }
  main { max-width: 980px; width: 100%; }
  .eyebrow { font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: clamp(32px, 5vw, 52px); margin: 12px 0 10px; letter-spacing: -.02em; }
  p.lead { color: var(--muted); font-size: 17px; max-width: 700px; margin: 0 0 34px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  a.card { display: block; text-decoration: none; color: var(--text); background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 22px; transition: .2s; }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .tag { font: 500 11px var(--mono); color: var(--c); letter-spacing: .08em; text-transform: uppercase; }
  a.card h2 { font-size: 20px; margin: 8px 0 6px; }
  a.card p { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0; }
  .arch { margin-top: 16px; font-size: 13px; color: var(--muted); }
  .arch a { color: var(--muted); }
  .topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .topline #langBox { display: flex; gap: 6px; }
  .foot { margin-top: 26px; color: var(--muted); font-size: 13px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .btn { all: unset; cursor: pointer; font-size: 12.5px; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); }
  .btn[aria-pressed=true] { color: var(--text); border-color: rgba(124,196,255,.5); background: rgba(124,196,255,.1); }
  .btn:focus-visible { outline: 2px solid var(--accent); }

  /* zijpaden: compacte kaarten onder de drie hoofdkaarten (ruimte voor meer zijpaden: voeg een <a class="side"> toe) */
  .sidehd { margin: 30px 0 10px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .sidehd h3 { margin: 0; font-size: 16px; letter-spacing: .02em; }
  .sidehd span { color: var(--muted); font-size: 13.5px; }
  .sides { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  a.side { display: block; text-decoration: none; color: var(--text); background: var(--bg-2); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 12px; padding: 12px 14px; transition: .2s; }
  a.side:hover { border-color: var(--accent); border-left-color: var(--c); transform: translateY(-1px); }
  a.side b { display: block; font-size: 15px; margin-bottom: 3px; }
  a.side small { display: block; color: var(--muted); font-size: 13px; line-height: 1.45; }

  /* taalkeuze bij de eerste start */
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>

  <section id="home" hidden>
    <div class="topline"><div class="eyebrow" id="eyebrow"></div><span id="langBox"></span></div>
    <h1 id="h"></h1>
    <p class="lead" id="lead"></p>
    <div class="grid">
      <a class="card" href="app/index.html?scene=cel" style="--c:var(--rna)"><span class="tag" id="c0tag"></span><h2 id="c0t"></h2><p id="c0p"></p></a>
      <a class="card" id="c1" href="app/index.html?scene=bcel&amp;story=bacterie" style="--c:#ff8f8f"><span class="tag" id="c1tag"></span><h2 id="c1t"></h2><p id="c1p"></p></a>
      <a class="card" href="atlas/index.html" style="--c:var(--dna)"><span class="tag" id="c2tag"></span><h2 id="c2t"></h2><p id="c2p"></p></a>
    </div>
    <div class="sidehd"><h3 id="sideH"></h3><span id="sideSub"></span></div>
    <div class="sides">
      <a class="side" href="app/index.html?scene=replicatie&amp;story=herstel" style="--c:var(--dna)"><b id="s1t"></b><small id="s1p"></small></a>
    </div>
    <p class="arch"><a href="docs/blueprint.html" id="c3l"></a> · <span id="archT"></span> <a href="poc/01-zoomreis/index.html">POC 1</a> · <a href="poc/02-dna-vormen/index.html">POC 2</a></p>
    <div class="foot"><span id="foot"></span></div>
  </section>
</main>
<script type="module">
import { L, langSwitch } from './shared/i18n.js';

/* geen aparte taalkeuze bij het openen: de taal wissel je met de knoppen NL/EN onderaan (en in de app) */
{
  const T = {
    eyebrow: { nl: 'Fase 3 · zijpaden in opbouw', en: 'Phase 3 · side paths in progress' },
    h: { nl: 'Van DNA tot eiwit', en: 'From DNA to protein' },
    lead: { nl: 'Een interactieve reis van DNA tot eiwit. Kies een cel: een menselijke cel of een bacterie. Klik op onderdelen om in te zoomen, tot op echte atoomstructuren.',
            en: 'An interactive journey from DNA to protein. Choose a cell: a human cell or a bacterium. Click on parts to zoom in, all the way down to real atomic structures.' },
    c0tag: { nl: 'Mens', en: 'Human' },
    c0t: { nl: 'Menselijke cel', en: 'Human cell' },
    c0p: { nl: 'Je begint in een menselijke cel en kiest daar zelf je route: volg een virus dat DNA binnenbrengt, of een signaalmolecule dat een gen aanzet. Elke route loopt verder tot een gevouwen en afgebroken eiwit.',
           en: 'You start in a human cell and choose your own route there: follow a virus bringing in DNA, or a signal molecule switching on a gene. Each route continues all the way to a folded and degraded protein.' },
    c1tag: { nl: 'Bacterie · nieuw', en: 'Bacterium · new' },
    c1t: { nl: 'Bacteriecel (E. coli)', en: 'Bacterial cell (E. coli)' },
    c1p: { nl: 'Geen kern: het DNA ligt los in de cel en kopiëren en vertalen gebeuren tegelijk. Met plasmiden, de onderdelen van een gen, het lac-operon en een vergelijking met de mens.',
           en: 'No nucleus: the DNA lies free in the cell, and copying and translating happen at once. With plasmids, the parts of a gene, the lac operon and a comparison with humans.' },
    c2tag: { nl: 'Atlas', en: 'Atlas' },
    c2t: { nl: 'DNA-bib', en: 'DNA library' },
    c2p: { nl: 'Alle soorten DNA en RNA in 3D uit echte PDB-structuren: A/B/Z-DNA, quadruplexen, tRNA, ribozymen, drug–DNA-complexen … met filters en vergelijkmodus.',
           en: 'All kinds of DNA and RNA in 3D from real PDB structures: A/B/Z-DNA, quadruplexes, tRNA, ribozymes, drug–DNA complexes … with filters and compare mode.' },
    sideH: { nl: 'Zijpaden', en: 'Side paths' },
    sideSub: { nl: 'Korte routes die dieper ingaan op één onderwerp.', en: 'Short routes that go deeper into one topic.' },
    s1t: { nl: 'DNA kopiëren en herstellen', en: 'Copying and repairing DNA' },
    s1p: { nl: 'Hoe een cel haar DNA één keer kopieert, fouten verbetert en schade herstelt, en wat p53 doet als dat misloopt.', en: 'How a cell copies its DNA once, corrects errors and repairs damage, and what p53 does when that goes wrong.' },
    archT: { nl: 'Archief (goedgekeurde proofs of concept):', en: 'Archive (approved proofs of concept):' },
    c3l: { nl: 'Blueprint (schema van de app)', en: 'Blueprint (design of the app, in Dutch)' },
    foot: { nl: 'Inhoud met status "concept" is nog niet tegen de bronnen nagekeken.', en: 'Content marked "draft" has not yet been checked against the sources.' },
  };
  for (const [id, v] of Object.entries(T)) document.getElementById(id).textContent = L(v);
  document.title = L(T.h);
  document.getElementById('langBox').append(langSwitch('btn'));
  document.getElementById('home').hidden = false;
}
</script>
</body>
</html>
