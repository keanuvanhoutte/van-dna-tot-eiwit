<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Van DNA tot eiwit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <main class="main">
    <!-- bovenbalk: navigatie, hoofdstuk, echte grootte/duur (niets hiervan ligt over de figuur) -->
    <header class="topbar">
      <div class="row1">
        <div class="navbtns">
          <button class="btn icon" id="bHome" title=""><span>⌂</span><em data-u="home"></em></button>
          <button class="btn icon" id="bUp" title=""><span>⤒</span><em data-u="zoomOut"></em></button>
        </div>
        <nav class="crumbs" id="crumbs" aria-label="breadcrumbs"></nav>
        <div class="tools">
          <button class="btn" id="bMap"><span>◎</span> <em data-u="whereAmI"></em></button>
          <a class="btn" id="bAtlas" href="../atlas/index.html"><span>🧬</span> <em data-u="atlas"></em></a>
          <button class="btn" id="bLabels" aria-pressed="true"><em class="keep" data-u="labels"></em></button>
          <button class="btn" id="bInfo" aria-pressed="false"><span>ℹ</span> <em data-u="info"></em></button>
          <span id="langBox"></span>
        </div>
      </div>
      <div class="row2">
        <div class="scalebox" id="scalebox"></div>
        <div class="story" id="story">
          <button class="sbtn" id="sPrev"><span class="arr">‹</span><span class="nm" id="sPrevName"></span></button>
          <div class="sinfo" id="sInfo"></div>
          <button class="sbtn" id="sNext"><span class="nm" id="sNextName"></span><span class="arr">›</span></button>
        </div>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="labels" id="labels"></div>
      <div class="boot" id="boot" role="status"><i></i><span>Van DNA tot eiwit wordt geladen…<br><small>Loading…</small></span></div>
    </div>

    <!-- onderstrook: uitleg van de stap + bediening als videospeler (onder de figuur, niet erover) -->
    <footer class="dock">
      <div class="caption" id="caption"><div class="ct" id="capTitle"></div><div class="cx" id="capText"></div></div>
      <div class="prow">
        <button class="tbtn play" id="tPlay" title=""></button>
        <button class="tbtn step" id="tPrev" title="">‹</button>
        <div class="track" id="track"></div>
        <button class="tbtn step" id="tNext" title="">›</button>
        <div class="nextch" id="nextCh"></div>
        <details class="gear" id="gear">
          <summary class="tbtn" id="gearBtn" title="">⚙</summary>
          <div class="gearbox"><label for="speed" data-u="speedLbl"></label>
            <select id="speed">
              <option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option><option value="2">2×</option>
            </select>
          </div>
        </details>
      </div>
      <div class="srow"><span id="playState"></span><span class="stepno" id="stepNo"></span></div>
    </footer>

    <div class="overlay" id="card"><div class="cardbox" id="cardbody"></div></div>
    <div class="overlay" id="map"><div class="mapbox" id="mapbody"></div></div>
  </main>
  <aside class="side" id="side"></aside>
</div>
<script type="module" src="engine.js"></script>
</body>
</html>
