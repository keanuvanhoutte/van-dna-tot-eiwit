<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<script>/* De GitHub Pages-kopie stuurt door naar het officiële adres (daar laadt de app als één gebundeld bestand: sneller en betrouwbaarder) */
if (/\.github\.io$/.test(location.hostname)) location.replace('https://dogma-bio.web.app' + location.pathname.replace(/^\/van-dna-tot-eiwit/, '') + location.search + location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dogma</title>
<link rel="icon" href="../shared/icons/logo-16.svg" type="image/svg+xml">
<link rel="icon" href="../shared/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0a1128">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <!-- bovenbalk (één rij): startmenu, uitzoomen, waar ben ik (verhaal › hoofdstuk), zoeken, hulpmiddelen, taal -->
  <header class="topbar">
    <div class="navbtns">
      <a class="btn icon" id="bHome" href="../index.html"><img class="logo" src="../shared/icons/logo-16.svg" alt=""><em data-u="home"></em></a>
      <button class="btn icon" id="bUp" title=""><span>⤒</span><em data-u="zoomOut"></em></button>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="breadcrumbs"></nav>
    <div class="topsearch" id="searchBox"></div>
    <div class="tools">
      <button class="btn r3btn" id="bReal3d" hidden><span>3D</span> <em data-u="real3d"></em></button>
      <button class="btn orgbtn" id="bOrg" hidden></button>
      <a class="btn" id="bAtlas" href="../atlas/index.html"><span>🧬</span> <em data-u="atlas"></em></a>
      <span id="langBox"></span>
    </div>
  </header>

  <!-- links het verhaal (inklapbaar), in het midden de figuur met de uitleg van de stap en de speler, rechts de uitleg over het proces (inklapbaar) -->
  <nav class="rail" id="rail" aria-label="">
    <div class="rhead">
      <button class="rbtn" id="railBtn" type="button" aria-expanded="false">☰</button>
      <span class="rtitle" id="railTitle"></span>
      <button class="rbtn rmap" id="bMap" type="button"><span>◎</span><em data-u="whereAmI"></em></button>
      <button class="rbtn rclose" id="railClose" type="button">‹</button>
    </div>
    <div class="rwaar" id="railWaar" hidden></div>
    <div class="rstripes" id="railStripes"></div>
    <div class="rlist" id="railList"></div>
  </nav>

  <main class="main">
    <div class="stage" id="stage">
      <div class="labels" id="labels"></div>
      <button class="backfig" id="bBack" type="button" hidden><span>‹</span><b></b><small></small></button>
      <div class="boot" id="boot" role="status"><i></i><span>Dogma wordt geladen…<br><small>Loading…</small></span></div>
      <script>/* laadtekst meteen in de gekozen taal (vóór de app geladen is) */
        try { var q = new URLSearchParams(location.search).get('lang'), l = q || localStorage.getItem('dna-app-lang');
          if (l === 'en') { document.documentElement.lang = 'en'; document.querySelector('#boot span').textContent = 'Loading Dogma…'; } } catch (e) {}
        (function () { /* loopt het laden mis (fout of na 25 s nog bezig): melding + herlaadknop in plaats van eindeloos laden */
          var shown = false;
          function fail() {
            var b = document.getElementById('boot'); if (!b || shown || b.classList.contains('gone')) return; shown = true;
            var en = document.documentElement.lang === 'en';
            b.classList.add('fail');
            b.querySelector('span').innerHTML = en
              ? 'Dogma did not load properly.<br><small>Your browser may be holding an older copy of the app.</small><br><button type="button">Reload</button>'
              : 'Dogma laadde niet goed.<br><small>Je browser heeft misschien nog een oudere versie van de app bewaard.</small><br><button type="button">Opnieuw laden</button>';
            b.querySelector('button').onclick = function () { var u = new URL(location.href); u.searchParams.set('r', Date.now()); location.replace(u); };
          }
          addEventListener('error', function (e) { if (e.error instanceof SyntaxError || /module|import/i.test(e.message || '')) fail(); });
          addEventListener('unhandledrejection', function () { fail(); });
          setTimeout(fail, 25000);
        })();
      </script>
    </div>

    <!-- uitleg bij de stap: onder de figuur (standaard), als zwevend venster op de figuur, of verborgen (⚙) -->
    <div class="caption" id="caption"><div class="cgrip" id="capGrip"><span class="gripdots" aria-hidden="true">⠿</span><span class="griptxt" id="capGripTxt"></span><button class="capbtn" id="capMin" type="button">–</button><button class="capbtn" id="capDock" type="button">⤓</button></div><button class="capbtn capfold" id="capFold" type="button">▾</button><div class="cmeta" id="capMeta"></div><span class="cpn" id="capNum"></span><div class="ct" id="capTitle"></div><div class="cx" id="capText"></div></div>

    <!-- speler: stap terug, afspelen/pauze, stap verder, stappen, herhalen, instellingen, volgend hoofdstuk -->
    <footer class="dock">
      <button class="tbtn step" id="tPrev" title="">‹</button>
      <button class="tbtn play" id="tPlay" title=""></button>
      <button class="tbtn step" id="tNext" title="">›</button>
      <div class="track" id="track"></div>
      <span class="stepno" id="stepNo"></span>
      <span class="dsp"></span>
      <button class="tbtn rep" id="tRepeat" title="" aria-pressed="false">🔁</button>
      <details class="gear" id="gear">
        <summary class="tbtn" id="gearBtn" title="">⚙</summary>
        <div class="gearbox">
          <div class="gh" data-u="settings"></div>
          <div class="gstate" id="playState"></div>
          <div class="grow"><label for="pLevel" data-u="pLevel"></label><select id="pLevel"></select></div>
          <div class="grow"><label for="pPlay" data-u="pPlay"></label><select id="pPlay"></select></div>
          <div class="grow"><label for="pRead" data-u="pRead"></label><select id="pRead"></select></div>
          <div class="grow"><label for="speed" data-u="speedLbl"></label>
            <select id="speed">
              <option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option><option value="2">2×</option>
            </select></div>
          <div class="grow"><label for="pCap" data-u="pCap"></label><select id="pCap"></select></div>
          <div class="grow chk"><input type="checkbox" id="pLabels"><label for="pLabels" data-u="pLabels"></label></div>
          <button type="button" class="greset" id="pReset" data-u="pReset"></button>
          <div class="gnote" data-u="pKeys"></div>
          <div class="gnote" data-u="pSaved"></div>
        </div>
      </details>
      <div class="nextch" id="nextCh"></div>
    </footer>

    <div class="overlay" id="card"><div class="cardbox" id="cardbody"></div></div>
    <div class="overlay" id="map"><div class="mapbox" id="mapbody"></div></div>
  </main>

  <aside class="side" id="side">
    <div class="shead"><span class="kind" id="sideKind"></span><button class="rbtn" id="sideClose" type="button">›</button></div>
    <h1 id="sideTitle"></h1>
    <div class="en" id="sideSub"></div>
    <div class="tabs" id="sideTabs" role="tablist"></div>
    <div class="tabbody" id="sideBody" role="tabpanel"></div>
  </aside>
  <button class="sidetab" id="sideTab" type="button"><span>‹</span> <em data-u="info"></em></button>
</div>
<script type="module">
  /* Online (Firebase) laadt één gebundeld bestand in plaats van alle losse modules: bij sommige browsers bleven er
   * af en toe enkele van de ~200 verzoeken eeuwig hangen, en dan bleef het laadscherm staan (tools/bundle.mjs).
   * Lokaal en op GitHub Pages: de losse bestanden, zoals altijd. */
  const online = /(^|\.)(dogma-bio|van-dna-tot-eiwit)\.(web\.app|firebaseapp\.com)$/.test(location.hostname);
  import(online ? './engine.bundle.js' : './engine.js');
</script>
</body>
</html>
