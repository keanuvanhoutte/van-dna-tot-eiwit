<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA-conformaties 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/theme.css">
<script src="https://cdn.jsdelivr.net/npm/3dmol@2.5.5/build/3Dmol-min.js"></script>
<style>
  body { min-height: 100vh; }
  .top { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .crumbs { font-size: 13px; color: var(--muted); }
  .crumbs a { color: var(--muted); text-decoration: none; }
  .crumbs a:hover { color: var(--text); }
  .crumbs b { color: var(--text); font-weight: 600; }
  .lang { all: unset; cursor: pointer; font: 500 11px var(--mono); padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; }
  .lang[aria-pressed=true] { color: var(--text); border-color: rgba(124,196,255,.5); }
  .scale { margin-left: auto; font: 500 11px var(--mono); color: var(--accent); border: 1px solid var(--line); padding: 5px 9px; border-radius: 6px; }
  .intro { padding: 18px 20px 6px; max-width: 980px; }
  .intro h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.01em; }
  .intro p { margin: 0; color: var(--muted); font-size: 14.5px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 14px 22px; padding: 14px 20px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; font-size: 12.5px; padding: 7px 11px; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed=true] { background: rgba(124,196,255,.16); color: var(--text); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .grp { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .tog { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .tog input { accent-color: #7cc4ff; }

  .viewers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 0 20px; }
  @media (max-width: 900px) { .viewers { grid-template-columns: 1fr; } }
  .v { background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
  .vh { padding: 12px 14px 10px; display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line); }
  .vh h2 { margin: 0; font-size: 20px; }
  .hand { font: 500 11px var(--mono); padding: 3px 7px; border-radius: 5px; }
  .hand.r { background: rgba(79,143,247,.16); color: #9cc0ff; }
  .hand.l { background: rgba(240,107,192,.16); color: #f06bc0; }
  .pdb { margin-left: auto; font: 500 11px var(--mono); color: var(--muted); text-decoration: none; }
  .pdb:hover { color: var(--accent); }
  .stage { position: relative; height: 430px; }
  .stage .load { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .hover { position: absolute; left: 10px; bottom: 10px; font: 500 11.5px var(--mono); background: rgba(7,11,22,.8); padding: 4px 8px; border-radius: 6px; pointer-events: none; opacity: 0; transition: opacity .12s; }
  .meta { padding: 10px 14px 4px; font-size: 12px; color: var(--muted); min-height: 38px; }
  .meta code { font-family: var(--mono); color: var(--text); letter-spacing: .04em; }
  .calc { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .calc td { padding: 6px 14px; border-top: 1px solid var(--line); }
  .calc td:first-child { color: var(--muted); }
  .calc td:last-child { text-align: right; font-family: var(--mono); }
  .calc .ok { color: #7fdc6a; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 12px 20px 0; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  .ref { padding: 26px 20px 10px; max-width: 1200px; }
  .ref h3 { margin: 0 0 4px; font-size: 18px; }
  .ref p.s { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
  .ref table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .ref th, .ref td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .ref th { font-weight: 600; }
  .ref td:first-child { color: var(--muted); width: 190px; }
  .note { margin: 18px 20px 40px; max-width: 1200px; padding: 14px 16px; border: 1px dashed rgba(255,194,71,.4); border-radius: 12px; font-size: 13.5px; color: var(--muted); }
  .note b { color: #ffc247; }
</style>
</head>
<body>
<div class="top">
  <div class="crumbs" id="crumbs"></div>
  <div class="scale" id="scaleTxt"></div>
  <span id="langBox"></span>
</div>

<div class="intro">
  <h1 data-t="h1"></h1>
  <p data-t="intro"></p>
</div>

<div class="toolbar">
  <div class="grp"><span data-t="view"></span>
    <div class="seg" id="style">
      <button data-v="cartoon" aria-pressed="true">Cartoon</button>
      <button data-v="stick" data-t="stick"></button>
      <button data-v="sphere" data-t="sphere"></button>
      <button data-v="trace" data-t="trace"></button>
    </div>
  </div>
  <div class="grp"><span data-t="colour"></span>
    <div class="seg" id="color">
      <button data-v="strand" aria-pressed="true" data-t="byStrand"></button>
      <button data-v="base" data-t="byBase"></button>
      <button data-v="elem" data-t="byElem"></button>
    </div>
  </div>
  <label class="tog"><input type="checkbox" id="hb"> <span data-t="hb"></span></label>
  <label class="tog"><input type="checkbox" id="syn"> <span data-t="synMark"></span></label>
  <label class="tog"><input type="checkbox" id="link" checked> <span data-t="link"></span></label>
  <label class="tog"><input type="checkbox" id="spin"> <span data-t="spin"></span></label>
</div>

<div class="viewers" id="viewers"></div>

<div class="legend" id="legend"></div>

<div class="ref">
  <h3 data-t="refH"></h3>
  <p class="s" data-t="refP"></p>
  <table>
    <thead><tr><th></th><th>A-DNA</th><th>B-DNA</th><th>Z-DNA</th></tr></thead>
    <tbody id="refBody"></tbody>
  </table>
</div>

<div class="note" data-t="note"></div>

<script>

const LANG = (() => { const q = new URLSearchParams(location.search).get('lang'); if (q === 'nl' || q === 'en') return q;
  try { const v = localStorage.getItem('dna-app-lang'); if (v) return v; } catch {} return (navigator.language || 'nl').startsWith('nl') ? 'nl' : 'en'; })();
document.documentElement.lang = LANG;
const tr = v => (v && typeof v === 'object') ? (v[LANG] ?? v.nl) : v;
const T = {
  crumbs: { nl: `<a href="../../index.html">Start</a> › <a href="../01-zoomreis/index.html">Cel</a> › Celkern › Chromatine › DNA-dubbelhelix › <b>Conformaties A · B · Z</b>`,
            en: `<a href="../../index.html">Home</a> › <a href="../01-zoomreis/index.html">Cell</a> › Nucleus › Chromatin › DNA double helix › <b>Conformations A · B · Z</b>` },
  scaleTxt: { nl: 'schaal ≈ 1–5 nm · echte atoomcoördinaten', en: 'scale ≈ 1–5 nm · real atomic coordinates' },
  h1: { nl: 'Drie gezichten van dezelfde dubbelhelix', en: 'Three faces of the same double helix' },
  intro: { nl: 'Echte kristalstructuren uit de Protein Data Bank. Sleep om te draaien, scroll om tot op atoomniveau in te zoomen, beweeg over een atoom voor details. De getallen onder elk model worden <b>live uit de coördinaten berekend</b> en naast de handboekwaarden gezet.',
           en: 'Real crystal structures from the Protein Data Bank. Drag to rotate, scroll to zoom down to atomic level, hover over an atom for details. The numbers below each model are <b>computed live from the coordinates</b> and placed next to textbook values.' },
  view: { nl: 'Weergave', en: 'View' }, stick: { nl: 'Stokjes', en: 'Sticks' }, sphere: { nl: 'Ruimtevullend', en: 'Space-filling' }, trace: { nl: 'Ruggengraat', en: 'Backbone' },
  colour: { nl: 'Kleur', en: 'Colour' }, byStrand: { nl: 'Per streng', en: 'By strand' }, byBase: { nl: 'Per base', en: 'By base' }, byElem: { nl: 'Per element', en: 'By element' },
  hb: { nl: 'Waterstofbruggen', en: 'Hydrogen bonds' }, synMark: { nl: 'Syn-basen markeren', en: 'Highlight syn bases' }, link: { nl: 'Samen draaien', en: 'Rotate together' }, spin: { nl: 'Rondraaien', en: 'Spin' },
  refH: { nl: 'Handboekwaarden (geïdealiseerde helices)', en: 'Textbook values (idealised helices)' },
  refP: { nl: 'Typische waarden uit vezeldiffractie en kristallografie. Echte moleculen wijken af door sequentie, buiging en kristalomgeving: vergelijk met de berekende waarden hierboven.',
          en: 'Typical values from fibre diffraction and crystallography. Real molecules deviate because of sequence, bending and crystal environment: compare with the computed values above.' },
  note: { nl: '<b>Wat is hier vereenvoudigd?</b> Kristalstructuren zijn korte stukjes (6–12 bp), dus Z-DNA toont maar een halve winding. De helixas wordt bepaald met een cilinderfit op de fosforatomen; twist en stijging volgen uit de oriëntatie van opeenvolgende basenparen (C1\'–C1\'-vectoren), gemiddeld over volledige dinucleotiden. Bij gebogen DNA (1BNA is licht gebogen) of zeer korte stukken zijn het schattingen. Watermoleculen en ionen zijn verborgen. Bronnen: Saenger (1984) <i>Principles of Nucleic Acid Structure</i>; Drew et al. (1981) PNAS; Wang et al. (1979) Nature.',
          en: '<b>What is simplified here?</b> Crystal structures are short pieces (6–12 bp), so Z-DNA shows only half a turn. The helix axis is found by fitting a cylinder to the phosphorus atoms; twist and rise follow from the orientation of consecutive base pairs (C1\'–C1\' vectors), averaged over complete dinucleotides. For bent DNA (1BNA is slightly bent) or very short pieces these are estimates. Water molecules and ions are hidden. Sources: Saenger (1984) <i>Principles of Nucleic Acid Structure</i>; Drew et al. (1981) PNAS; Wang et al. (1979) Nature.' },
  loading: { nl: 'Structuur laden uit de PDB…', en: 'Loading structure from the PDB…' },
  failed: { nl: 'Laden mislukt: ', en: 'Loading failed: ' },
  right: { nl: 'rechtshandig', en: 'right-handed' }, left: { nl: 'linkshandig', en: 'left-handed' },
  strand: { nl: 'streng', en: 'strand' }, atom: { nl: 'atoom', en: 'atom' },
  hbond: { nl: 'waterstofbrug', en: 'hydrogen bond' }, synConf: { nl: 'syn-conformatie', en: 'syn conformation' },
  cHand: { nl: 'Draairichting (berekend)', en: 'Handedness (computed)' },
  cTwist: { nl: 'Gem. twist per basenpaar', en: 'Mean twist per base pair' }, perTurn: { nl: 'bp/winding', en: 'bp/turn' },
  cSteps: { nl: 'Twist per stap', en: 'Twist per step' },
  cRise: { nl: 'Gem. stijging per basenpaar', en: 'Mean rise per base pair' },
  cDiam: { nl: 'Diameter fosfor–fosfor / buitenkant', en: 'Diameter phosphorus–phosphorus / outer' },
  cSugar: { nl: "Suikers C3'-endo / C2'-endo", en: "Sugars C3'-endo / C2'-endo" },
  cSyn: { nl: 'Basen syn / anti', en: 'Bases syn / anti' },
  border: { nl: 'grens', en: 'borderline' }, borderTip: { nl: 'χ binnen 10° van de ±90°-grens (hoog-anti)', en: 'χ within 10° of the ±90° boundary (high anti)' },
  cHb: { nl: 'Waterstofbruggen tussen strengen', en: 'Hydrogen bonds between strands' },
};
const REF = [
  [{ nl: 'Draairichting', en: 'Handedness' }, { nl: 'rechtshandig', en: 'right-handed' }, { nl: 'rechtshandig', en: 'right-handed' }, { nl: 'linkshandig', en: 'left-handed' }],
  [{ nl: 'Basenparen per winding', en: 'Base pairs per turn' }, '~11', { nl: '~10,5 in oplossing (10 in het vezelmodel)', en: '~10.5 in solution (10 in the fibre model)' }, '12'],
  [{ nl: 'Twist per basenpaar', en: 'Twist per base pair' }, '~ +33°', '~ +34–36°', { nl: '~ −30° gemiddeld (−60° per dinucleotide)', en: '~ −30° on average (−60° per dinucleotide)' }],
  [{ nl: 'Stijging per basenpaar', en: 'Rise per base pair' }, { nl: '~2,6 Å', en: '~2.6 Å' }, { nl: '~3,4 Å', en: '~3.4 Å' }, { nl: '~3,7 Å', en: '~3.7 Å' }],
  [{ nl: 'Diameter', en: 'Diameter' }, '~23 Å', '~20 Å', '~18 Å'],
  [{ nl: 'Suikerconformatie', en: 'Sugar pucker' }, "C3'-endo", "C2'-endo", "C2'-endo (C), C3'-endo (G)"],
  [{ nl: 'Glycosidische binding', en: 'Glycosidic bond' }, 'anti', 'anti', 'anti (C), <b>syn</b> (G)'],
  [{ nl: 'Grote groef', en: 'Major groove' }, { nl: 'smal en diep', en: 'narrow and deep' }, { nl: 'breed en diep', en: 'wide and deep' }, { nl: 'vrijwel vlak', en: 'almost flat' }],
  [{ nl: 'Kleine groef', en: 'Minor groove' }, { nl: 'breed en ondiep', en: 'wide and shallow' }, { nl: 'smal en diep', en: 'narrow and deep' }, { nl: 'smal en diep', en: 'narrow and deep' }],
  [{ nl: 'Herhalende eenheid', en: 'Repeating unit' }, '1 bp', '1 bp', { nl: '2 bp (dinucleotide) → zigzag-ruggengraat', en: '2 bp (dinucleotide) → zigzag backbone' }],
  [{ nl: 'Wanneer?', en: 'When?' }, { nl: 'bij dehydratatie; dubbelstrengig RNA en RNA–DNA-hybriden nemen A-vorm aan', en: 'upon dehydration; double-stranded RNA and RNA–DNA hybrids adopt the A form' },
    { nl: 'standaardvorm onder fysiologische omstandigheden', en: 'standard form under physiological conditions' },
    { nl: 'alternerende purine–pyrimidine, vooral (CG)<sub>n</sub>; hoge zoutconcentratie of negatieve supercoiling; herkend door Zα-domeinen (bv. ADAR1)', en: 'alternating purine–pyrimidine, especially (CG)<sub>n</sub>; high salt or negative supercoiling; recognised by Zα domains (e.g. ADAR1)' }],
];
document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = tr(T[e.dataset.t]));
document.getElementById('crumbs').innerHTML = tr(T.crumbs);
document.getElementById('scaleTxt').textContent = tr(T.scaleTxt);
document.getElementById('refBody').innerHTML = REF.map(r => `<tr>${r.map(c => `<td>${tr(c)}</td>`).join('')}</tr>`).join('');
document.getElementById('langBox').innerHTML = ['nl', 'en'].map(l => `<button class="lang" data-l="${l}" aria-pressed="${l === LANG}">${l.toUpperCase()}</button>`).join('');
document.querySelectorAll('.lang').forEach(b => b.onclick = () => { try { localStorage.setItem('dna-app-lang', b.dataset.l); } catch {} location.search = ''; });
</script>
<script>
const CSS = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MODELS = [
  { key: 'A', id: '440D', name: 'A-DNA', hand: 'r' },
  { key: 'B', id: '1BNA', name: 'B-DNA', hand: 'r' },
  { key: 'Z', id: '1DCG', name: 'Z-DNA', hand: 'l' },
];
const BASECOL = { DA: '#5ad17a', DT: '#ff6b6b', DG: '#ffc247', DC: '#4fb0ff' };
const BASENAME = { DA: 'adenine', DT: 'thymine', DG: 'guanine', DC: 'cytosine' };
const state = { style: 'cartoon', color: 'strand', hb: false, syn: false };

document.getElementById('legend').innerHTML =
  `<span><i style="background:${CSS('--dna')}"></i>${tr(T.strand)} 1</span><span><i style="background:${CSS('--dna-2')}"></i>${tr(T.strand)} 2</span>` +
  Object.entries(BASECOL).map(([k, c]) => `<span><i style="background:${c}"></i>${BASENAME[k]} (${k[1]})</span>`).join('') +
  `<span><i style="background:#fff"></i>- - ${tr(T.hbond)}</span><span><i style="background:#f06bc0"></i>${tr(T.synConf)}</span>`;

/* ---------- kleine vectorbibliotheek ---------- */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a); return a.map(x => x / l); };
const P = a => [a.x, a.y, a.z];
function torsion(a, b, c, d) {
  const b0 = sub(a, b), b1 = norm(sub(c, b)), b2 = sub(d, c);
  const v = sub(b0, b1.map(x => x * dot(b0, b1))), w = sub(b2, b1.map(x => x * dot(b2, b1)));
  return Math.atan2(dot(cross(b1, v), w), dot(v, w)) * 180 / Math.PI;
}
/* Helixas = as van de cilinder waarop alle fosforatomen het best liggen.
 * Zoek over richtingen; per richting: projecteer op het vlak en fit een cirkel (Kåsa, lineair). */
function perp(v) { const e1 = norm(cross(v, Math.abs(v[0]) < .9 ? [1, 0, 0] : [0, 1, 0])); return [e1, cross(v, e1)]; }
function circleFit(pts, v) {
  const [e1, e2] = perp(v);
  const uv = pts.map(p => [dot(p, e1), dot(p, e2)]);
  // normaalvergelijkingen voor u² + v² + D u + E v + F = 0
  const A = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], b = [0, 0, 0];
  for (const [u, w] of uv) { const r = [u, w, 1], y = -(u * u + w * w); for (let i = 0; i < 3; i++) { b[i] += r[i] * y; for (let j = 0; j < 3; j++) A[i][j] += r[i] * r[j]; } }
  const det = m => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  const d0 = det(A), sol = [0, 1, 2].map(k => det(A.map((row, i) => row.map((x, j) => j === k ? b[i] : x))) / d0);
  const cu = -sol[0] / 2, cw = -sol[1] / 2, r = Math.sqrt(cu * cu + cw * cw - sol[2]);
  const err = uv.reduce((s, [u, w]) => s + (Math.hypot(u - cu, w - cw) - r) ** 2, 0);
  const zc = pts.reduce((s, p) => s + dot(p, v), 0) / pts.length;
  return { err, r, c: [0, 1, 2].map(i => cu * e1[i] + cw * e2[i] + zc * v[i]) };
}
function helixAxis(pts) {
  let best = null;
  const tryDir = v => { v = norm(v); if (v[2] < 0) v = v.map(x => -x); const f = circleFit(pts, v); if (f.r && (!best || f.err < best.err)) best = { ...f, v }; };
  for (let i = 0; i < 3000; i++) { // gelijkmatig verdeelde richtingen (Fibonacci-halve bol)
    const z = i / 3000, t = Math.PI * (3 - Math.sqrt(5)) * i, s = Math.sqrt(1 - z * z);
    tryDir([s * Math.cos(t), s * Math.sin(t), z]);
  }
  for (const spread of [.06, .015, .004]) { // verfijnen rond de beste richting
    const v0 = best.v, [a, b] = perp(v0);
    for (let i = 0; i < 600; i++) { const r = spread * Math.sqrt(Math.random()), t = Math.random() * 2 * Math.PI; tryDir([0, 1, 2].map(k => v0[k] + r * (Math.cos(t) * a[k] + Math.sin(t) * b[k]))); }
  }
  return best;
}

/* ---------- analyse op echte coördinaten ---------- */
function analyse(atoms) {
  const byRes = new Map();
  for (const a of atoms) { const k = a.chain + a.resi; if (!byRes.has(k)) byRes.set(k, {}); byRes.get(k)[a.atom] = a; }
  const { c, v } = helixAxis(atoms.filter(a => a.atom === 'P').map(P));
  // rechtshandig assenstelsel: e1, e2 loodrecht op de as, e3 = as
  const e3 = v, e1 = norm(cross(e3, Math.abs(e3[0]) < .9 ? [1, 0, 0] : [0, 1, 0])), e2 = cross(e3, e1);

  // waterstofbruggen tussen de basen van beide strengen (N/O-atomen, 2,6–3,3 Å)
  const backbone = new Set(['OP1', 'OP2', 'O1P', 'O2P', "O3'", "O5'", "O4'"]);
  const polar = atoms.filter(a => (a.elem === 'N' || a.elem === 'O') && !backbone.has(a.atom));
  const hbonds = [];
  for (const a of polar) for (const b of polar) {
    if (a.chain >= b.chain) continue;
    const d = Math.hypot(...sub(P(a), P(b)));
    if (d >= 2.6 && d <= 3.3) hbonds.push([a, b, d]);
  }

  // basenparen = residuparen met de meeste waterstofbruggen tussen de strengen
  const cnt = new Map();
  for (const [x, y] of hbonds) { const k = x.chain + x.resi + '|' + y.chain + y.resi; cnt.set(k, (cnt.get(k) ?? 0) + 1); }
  const pairs = [];
  for (const [k, n] of [...cnt].sort((p, q) => q[1] - p[1])) {
    const [ka, kb] = k.split('|');
    if (n >= 2 && !pairs.some(p => p[0] === ka || p[1] === kb)) pairs.push([ka, kb]);
  }
  // sorteren langs de as, dan twist en stijging tussen opeenvolgende basenparen
  const bp = pairs.map(([ka, kb]) => {
    const c1 = byRes.get(ka)?.["C1'"], c2 = byRes.get(kb)?.["C1'"];
    if (!c1 || !c2) return null;
    const t = sub(P(c2), P(c1)), tp = sub(t, e3.map(x => x * dot(t, e3)));
    const mid = [0, 1, 2].map(i => (c1[['x', 'y', 'z'][i]] + c2[['x', 'y', 'z'][i]]) / 2);
    return { t: norm(tp), z: dot(mid, e3) };
  }).filter(Boolean).sort((p, q) => p.z - q.z);
  const twists = [], rises = [];
  for (let i = 1; i < bp.length; i++) {
    const ang = Math.atan2(dot(cross(bp[i - 1].t, bp[i].t), e3), dot(bp[i - 1].t, bp[i].t)) * 180 / Math.PI;
    twists.push(ang); rises.push(bp[i].z - bp[i - 1].z);
  }
  const radii = atoms.filter(a => a.atom === 'P').map(a => { const d = sub(P(a), c); return Math.hypot(dot(d, e1), dot(d, e2)); });
  const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
  // gemiddelde over een even aantal stappen: Z-DNA herhaalt per dinucleotide (twee verschillende stappen)
  const twist = mean(twists.slice(0, twists.length - twists.length % 2));
  const radial = atoms.map(a => { const d = sub(P(a), c); return Math.hypot(dot(d, e1), dot(d, e2)); }).sort((x, y) => x - y);
  const outer = 2 * radial[Math.floor(radial.length * .98)];

  // suikerconformatie (pseudorotatiefase) en glycosidische hoek χ
  let north = 0, south = 0, syn = 0, anti = 0, border = 0; const synRes = [];
  for (const r of byRes.values()) {
    const g = k => r[k] && P(r[k]);
    const n = [["C4'", "O4'", "C1'", "C2'"], ["O4'", "C1'", "C2'", "C3'"], ["C1'", "C2'", "C3'", "C4'"], ["C2'", "C3'", "C4'", "O4'"], ["C3'", "C4'", "O4'", "C1'"]];
    if (n.flat().every(k => r[k])) {
      const [v0, v1, v2, v3, v4] = n.map(q => torsion(...q.map(g)));
      let ph = Math.atan2(v4 + v1 - v3 - v0, 2 * v2 * (Math.sin(36 * Math.PI / 180) + Math.sin(72 * Math.PI / 180))) * 180 / Math.PI;
      ph = (ph + 360) % 360;
      if (ph < 90 || ph > 324) north++; else if (ph >= 108 && ph <= 216) south++;
    }
    const any = Object.values(r)[0];
    const pur = any.resn === 'DA' || any.resn === 'DG';
    const q = pur ? ["O4'", "C1'", 'N9', 'C4'] : ["O4'", "C1'", 'N1', 'C2'];
    if (q.every(k => r[k])) {
      const chi = torsion(...q.map(g));
      if (Math.abs(Math.abs(chi) - 90) < 10) border++;
      else if (Math.abs(chi) < 90) { syn++; synRes.push({ chain: any.chain, resi: any.resi, resn: any.resn }); } else anti++;
    }
  }

  return { c, e1, e2, e3, twist, nbp: bp.length, twists, bpt: 360 / Math.abs(twist), rise: mean(rises), diam: 2 * mean(radii), outer, hand: twist > 0 ? 'rechts' : 'links', north, south, syn, anti, border, synRes, hbonds };
}

/* zet de helixas verticaal en in het midden (echte coördinaten worden enkel geroteerd) */
function orient(atoms, g) {
  for (const a of atoms) {
    const d = sub(P(a), g.c);
    a.x = dot(d, g.e1); a.y = dot(d, g.e3); a.z = -dot(d, g.e2);
  }
}

/* ---------- viewers ---------- */
const viewersEl = document.getElementById('viewers');
const V = [];
for (const m of MODELS) {
  const el = document.createElement('div'); el.className = 'v';
  el.innerHTML = `
    <div class="vh"><h2>${m.name}</h2><span class="hand ${m.hand}">${tr(m.hand === 'r' ? T.right : T.left)}</span>
      <a class="pdb" href="https://www.rcsb.org/structure/${m.id}" target="_blank" rel="noopener">PDB ${m.id} ↗</a></div>
    <div class="stage"><div class="load">${tr(T.loading)}</div><div class="hover"></div></div>
    <div class="meta">…</div>
    <table class="calc"></table>`;
  viewersEl.append(el);
  const stage = el.querySelector('.stage');
  const viewer = $3Dmol.createViewer(stage, { backgroundColor: CSS('--bg-2'), antialias: true });
  V.push({ m, el, stage, viewer });
}

async function load(v) {
  const { m, el, viewer } = v;
  const [txt, info] = await Promise.all([
    fetch(`https://files.rcsb.org/download/${m.id}.pdb`).then(r => r.text()),
    fetch(`https://data.rcsb.org/rest/v1/core/entry/${m.id}`).then(r => r.json()),
  ]);
  // enkel DNA-atomen houden (geen water, ionen, alternatieve posities B)
  const clean = txt.split('\n').filter(l => /^(ATOM|HETATM)/.test(l) ? /^ATOM/.test(l) && [' ', 'A'].includes(l[16]) : !/^(ANISOU)/.test(l)).join('\n');
  const mdl = viewer.addModel(clean, 'pdb');
  const atoms = mdl.selectedAtoms({});
  const g = analyse(atoms);
  orient(atoms, g);
  v.g = g; v.atoms = atoms;

  const seq = ch => atoms.filter(a => a.chain === ch && a.atom === "C1'").sort((a, b) => a.resi - b.resi).map(a => a.resn[1]).join('');
  const chains = [...new Set(atoms.map(a => a.chain))];
  const res = info.rcsb_entry_info?.resolution_combined?.[0];
  el.querySelector('.meta').innerHTML =
    `5'-<code>${seq(chains[0])}</code>-3' · ${info.exptl?.[0]?.method?.toLowerCase() ?? ''}${res ? ` · ${res} Å` : ''}<br>` +
    `<span style="opacity:.8">${(info.struct?.title ?? '').toLowerCase().replace(/^./, s => s.toUpperCase())}</span>`;

  const expect = { A: { hand: 'rechts' }, B: { hand: 'rechts' }, Z: { hand: 'links' } }[m.key];
  el.querySelector('.calc').innerHTML = `
    <tr><td>${tr(T.cHand)}</td><td class="${g.hand === expect.hand ? 'ok' : ''}">${tr(g.hand === 'rechts' ? T.right : T.left)} ${g.hand === expect.hand ? '✓' : '⚠'}</td></tr>
    <tr><td>${tr(T.cTwist)} (${g.nbp} bp)</td><td>${g.twist > 0 ? '+' : ''}${g.twist.toFixed(1)}° → ${g.bpt.toFixed(1)} ${tr(T.perTurn)}</td></tr>
    <tr><td>${tr(T.cSteps)}</td><td style="font-size:11px">${g.twists.map(t => t.toFixed(0) + '°').join(' · ')}</td></tr>
    <tr><td>${tr(T.cRise)}</td><td>${g.rise.toFixed(2)} Å</td></tr>
    <tr><td>${tr(T.cDiam)}</td><td>${g.diam.toFixed(1)} / ${g.outer.toFixed(1)} Å</td></tr>
    <tr><td>${tr(T.cSugar)}</td><td>${g.north} / ${g.south}</td></tr>
    <tr><td>${tr(T.cSyn)}</td><td>${g.syn} / ${g.anti}${g.border ? ` <span title="${tr(T.borderTip)}">(+${g.border} ${tr(T.border)})</span>` : ''}</td></tr>
    <tr><td>${tr(T.cHb)}</td><td>${g.hbonds.length}</td></tr>`;

  const hov = v.stage.querySelector('.hover');
  viewer.setHoverable({}, true, a => {
    hov.textContent = `${a.resn} ${a.resi} · ${tr(T.strand)} ${a.chain} · ${tr(T.atom)} ${a.atom} (${a.elem})`; hov.style.opacity = 1;
  }, () => { hov.style.opacity = 0; });
  v.stage.querySelector('.load').remove();
  render(v);
  viewer.zoomTo(); viewer.zoom(0.9); viewer.render();
}

function colorFn(v) {
  const c1 = CSS('--dna'), c2 = CSS('--dna-2');
  const chains = [...new Set(v.atoms.map(a => a.chain))];
  if (state.color === 'strand') return a => a.chain === chains[0] ? c1 : c2;
  if (state.color === 'base') return a => /'|P$|^OP|O[12]P/.test(a.atom) ? '#8791a8' : BASECOL[a.resn] ?? '#aaa';
  return null;
}
function render(v) {
  const { viewer } = v;
  viewer.setStyle({}, {});
  viewer.removeAllShapes();
  const cf = colorFn(v);
  const col = cf ? { colorfunc: cf } : { colorscheme: 'Jmol' };
  const st = {
    cartoon: { cartoon: { ...col, ribbon: false, thickness: .6, opacity: 1 }, stick: { ...col, radius: .16 } },
    stick: { stick: { ...col, radius: .2 } },
    sphere: { sphere: { ...col, scale: 1 } },
    trace: { stick: { ...col, radius: .08, opacity: .35 } },
  }[state.style];
  viewer.setStyle({}, st);
  if (state.style === 'cartoon') viewer.setStyle({ atom: ['P', 'OP1', 'OP2', "O5'", "C5'", "C4'", "O4'", "C3'", "O3'", "C2'", "C1'"] }, { cartoon: st.cartoon });
  if (state.style === 'trace') {
    // de fosforketen per streng: toont zigzag (Z) versus gladde spiraal (A/B)
    [...new Set(v.atoms.map(a => a.chain))].forEach((ch, i) => {
      const ps = v.atoms.filter(a => a.chain === ch && a.atom === 'P').sort((a, b) => a.resi - b.resi);
      const c = CSS(i ? '--dna-2' : '--dna');
      for (let i = 1; i < ps.length; i++) v.viewer.addCylinder({ start: ps[i - 1], end: ps[i], radius: .5, color: c });
      for (const p of ps) v.viewer.addSphere({ center: p, radius: .9, color: c });
    });
  }
  if (state.hb) for (const [a, b] of v.g.hbonds)
    viewer.addCylinder({ start: { x: a.x, y: a.y, z: a.z }, end: { x: b.x, y: b.y, z: b.z }, radius: .07, dashed: true, dashLength: .25, gapLength: .18, color: '#ffffff' });
  if (state.syn) for (const r of v.g.synRes)
    viewer.setStyle({ chain: r.chain, resi: r.resi }, { stick: { color: '#f06bc0', radius: .26 } });
  viewer.render();
}
const renderAll = () => V.forEach(v => v.atoms && render(v));

function seg(id, key) {
  const box = document.getElementById(id);
  box.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    state[key] = b.dataset.v; renderAll();
  };
}
seg('style', 'style'); seg('color', 'color');
document.getElementById('hb').onchange = e => { state.hb = e.target.checked; renderAll(); };
document.getElementById('syn').onchange = e => { state.syn = e.target.checked; renderAll(); };
document.getElementById('spin').onchange = e => V.forEach(v => v.viewer.spin(e.target.checked ? 'y' : false, .6));

// samen draaien: kopieer de kijkhoek (niet de zoom) naar de andere viewers
let syncing = false;
V.forEach(v => v.viewer.setViewChangeCallback?.(view => {
  if (syncing || !document.getElementById('link').checked) return;
  syncing = true;
  for (const o of V) if (o !== v && o.atoms) { const ov = o.viewer.getView(); ov[4] = view[4]; ov[5] = view[5]; ov[6] = view[6]; ov[7] = view[7]; o.viewer.setView(ov); }
  syncing = false;
}));

Promise.all(V.map(v => load(v).catch(err => { v.stage.querySelector('.load').textContent = tr(T.failed) + err.message; console.error(err); })));
</script>
</body>
</html>
