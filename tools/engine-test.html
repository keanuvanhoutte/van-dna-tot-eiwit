<!doctype html>
<meta charset="utf-8">
<title>engine-test</title>
<body><pre id="out">running…</pre>
<iframe id="f" src="../app/index.html?scene=rt&rafpoly&auto=0" style="width:1600px;height:900px"></iframe>
<script>
/* Test van de afspeelbediening ("videospeler"):
 *  deel 1 (⏸ = blijf bij deze stap): stap 1 speelt, herhaalt zich en gaat nooit vanzelf verder; › vloeit over (ghost) naar
 *         stap 2; midden in een stap › spoelt eerst door; ‹ gaat terug; klik op een stuk van de tijdlijn springt naar die stap.
 *  deel 2 (▶ = vanzelf verder): na de stap vult de leespauze het stuk van de tijdlijn en gaat het vanzelf verder;
 *         ⏸ houdt de stap vast; ▶ gaat weer verder.
 * Gebruik: headless Chrome --dump-dom tools/engine-test.html (of .fix-ronde/pw.py dump) */
const out = document.getElementById('out'), log = [];
const wait = ms => new Promise(r => setTimeout(r, ms));
/* wachten tot de app in het frame geladen is (stapnummer ingevuld) */
const ready = async fr => { for (let i = 0; i < 600; i++) { const e = fr.contentDocument?.getElementById('stepNo'); if (e && e.textContent) return; await wait(100); } };
(async () => {
  await ready(document.getElementById('f'));
  const d = document.getElementById('f').contentDocument, g = id => d.getElementById(id);
  const segs = dd => [...dd.querySelectorAll('#track .seg')];
  const cur = dd => segs(dd).findIndex(s => s.classList.contains('cur')) + 1;
  const st = tag => log.push(`${tag}: ${g('stepNo').textContent} · stuk ${cur(d)}/${segs(d).length} · wacht=${g('tNext').classList.contains('pulse')} · ghost=${!!d.querySelector('svg.ghost')} · knop=${g('tPlay').textContent} · ${g('playState').textContent}`);
  st('start (⏸-modus)');
  await wait(9500); st('na 9,5 s: stap 1 klaar → › knippert, stap blijft 1');
  await wait(13000); st('na 22,5 s: nog steeds stap 1 (herhaalt, nooit vanzelf verder)');
  g('tNext').click(); await wait(150); st('150 ms na ›: stap 2 + ghost');
  await wait(1600); st('1,75 s later: ghost weg');
  g('tNext').click(); await wait(300); st('› midden in stap 2 (spoelen)');
  await wait(1200); st('1,5 s later: stap 3');
  g('tPrev').click(); await wait(1000); st('‹ (vorige)');
  segs(d)[4].click(); await wait(400); st('klik op stuk 5 van de tijdlijn');
  const last = segs(d).length - 1; segs(d)[last].click(); await wait(400);
  log.push(`laatste stap: › uit=${g('tNext').disabled} · volgend-hoofdstukknop=${g('nextCh').classList.contains('show') ? g('nextCh').textContent.trim() : '-'}`);
  log.push(`bovenbalk: ‹ "${g('sPrev').textContent.trim()}" · › "${g('sNext').textContent.trim()}"`);
  /* deel 2: vanzelf verder (auto=1) */
  const f2 = document.createElement('iframe'); f2.style.cssText = 'width:1600px;height:900px';
  f2.src = '../app/index.html?scene=rt&rafpoly&auto=1'; document.body.append(f2);
  await ready(f2);
  const d2 = f2.contentDocument, g2 = id => d2.getElementById(id);
  const fill2 = () => { const s = segs(d2)[cur(d2) - 1]?.querySelector('s'); return s ? s.style.width || '0%' : '-'; };
  const st2 = tag => log.push(`AUTO ${tag}: ${g2('stepNo').textContent} · leespauze ${fill2()} · knop=${g2('tPlay').textContent}`);
  st2('start (▶-modus)');
  await wait(12000); st2('na 12 s (stap 1 klaar, leespauze vult)');
  await wait(10000); st2('na 22 s (vanzelf verder naar stap 2)');
  g2('tPlay').click(); const s0 = g2('stepNo').textContent; await wait(15000);
  log.push('AUTO ⏸ 15 s: ' + s0 + ' → ' + g2('stepNo').textContent + ' (moet gelijk blijven) · knop=' + g2('tPlay').textContent);
  g2('tPlay').click(); await wait(14000);
  log.push('AUTO ▶ opnieuw, 14 s later: ' + g2('stepNo').textContent + ' (moet meteen verder zijn) · knop=' + g2('tPlay').textContent);
  /* deel 3: laatste stap van een hoofdstuk uit het verhaal → knop "Volgend hoofdstuk: …" + namen in de bovenbalk */
  const f3 = document.createElement('iframe'); f3.style.cssText = 'width:1600px;height:900px';
  f3.src = '../app/index.html?scene=transcriptie&story=virus&rafpoly&auto=0&step=99&p=0.97'; document.body.append(f3);
  await ready(f3); await wait(3000);
  const g3 = id => f3.contentDocument.getElementById(id);
  log.push(`HOOFDSTUK laatste stap: ${g3('stepNo').textContent} · › uit=${g3('tNext').disabled} · knop="${g3('nextCh').classList.contains('show') ? g3('nextCh').textContent.trim() : '-'}"`);
  log.push(`HOOFDSTUK bovenbalk: ${g3('sInfo').textContent.trim()} · ‹ "${g3('sPrev').textContent.trim()}" · › "${g3('sNext').textContent.trim()}"`);
  out.textContent = log.join('\n');
})();
</script>
