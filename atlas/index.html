<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<script>/* De GitHub Pages-kopie stuurt door naar het officiële adres (daar laadt de app als één gebundeld bestand: sneller en betrouwbaarder) */
if (/\.github\.io$/.test(location.hostname)) location.replace('https://dogma-bio.web.app' + location.pathname.replace(/^\/van-dna-tot-eiwit/, '') + location.search + location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D-bibliotheek · Dogma</title>
<link rel="icon" href="../shared/icons/logo-16.svg" type="image/svg+xml">
<link rel="icon" href="../shared/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0a1128">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="atlas.css">
<script src="https://cdn.jsdelivr.net/npm/3dmol@2.5.5/build/3Dmol-min.js"></script>
</head>
<body>
<header class="top">
  <a class="back" id="back" hidden></a>
  <a class="home" id="home" href="../index.html"></a>
  <div class="ttl"><b id="ttl"></b><span id="ttlSub"></span></div>
  <div class="sp"></div>
  <a class="story" id="storyLink" href="../app/index.html"></a>
  <span id="langBox"></span>
</header>

<div class="layout">
  <aside class="side">
    <button class="pclose" id="sideClose" type="button">«</button>
    <button class="rail" id="sideRail" type="button"><span>»</span><b></b></button>
    <div class="stabs" role="tablist" id="stabs">
      <button role="tab" id="tabAtlas" data-pane="atlas" aria-selected="true"></button>
      <button role="tab" id="tabPdb" data-pane="pdb" aria-selected="false"></button>
    </div>
    <div class="spane" id="paneAtlas" role="tabpanel" aria-labelledby="tabAtlas">
      <div class="stip" id="tipAtlas"></div>
      <div class="search"><input id="q" type="search" autocomplete="off"><div class="qinfo" id="qinfo"></div></div>
      <div class="filt" id="filters"></div>
    </div>
    <form class="pdbform spane" id="pdbForm" autocomplete="off" role="tabpanel" aria-labelledby="tabPdb" hidden>
      <label for="pdbIn" id="pdbLbl"></label>
      <div class="pdbrow"><input id="pdbIn" maxlength="40" spellcheck="false"><button id="pdbGo" type="submit"></button></div>
      <div class="pdbmsg" id="pdbMsg" role="status"></div>
    </form>
    <div class="count"><span id="count"></span><button class="link" id="reset"></button></div>
    <ul class="list" id="list"></ul>
  </aside>

  <main class="main">
    <div class="head">
      <div class="htxt"><h1 id="eName"></h1><div class="badges" id="eBadges"></div></div>
      <button class="cmpBtn" id="cmpBtn" aria-pressed="false"></button>
    </div>
    <div class="presets" id="presets" hidden></div>
    <div class="cmpHint" id="cmpHint" hidden></div>
    <div class="toolbar" id="toolbar">
      <div class="grp"><span data-t="view"></span>
        <div class="seg" id="style">
          <button data-v="cartoon" aria-pressed="true">Cartoon</button>
          <button data-v="stick" data-t="stick"></button>
          <button data-v="sphere" data-t="sphere"></button>
        </div>
      </div>
      <div class="grp" id="basesGrp" hidden><span data-t="basesLbl"></span>
        <div class="seg" id="bases">
          <button data-v="rings" data-t="rings"></button>
          <button data-v="rungs" data-t="rungs"></button>
        </div>
      </div>
      <div class="grp"><span data-t="colour"></span>
        <div class="seg" id="color">
          <button data-v="part" data-t="byPart"></button>
          <button data-v="type" aria-pressed="true" data-t="byType"></button>
          <button data-v="chain" data-t="byChain"></button>
          <button data-v="base" data-t="byBase"></button>
          <button data-v="elem" data-t="byElem"></button>
        </div>
      </div>
      <details class="opts" id="optsBox"><summary data-t="showOpts"></summary>
      <div class="togs">
        <label class="tog"><input type="checkbox" id="na" checked> <span data-t="naTog"></span></label>
        <label class="tog"><input type="checkbox" id="hb"> <span data-t="hb"></span></label>
        <label class="tog"><input type="checkbox" id="syn"> <span data-t="synMark"></span></label>
        <label class="tog"><input type="checkbox" id="ions" checked> <span data-t="ions"></span></label>
        <label class="tog"><input type="checkbox" id="ligs" checked> <span data-t="ligs"></span></label>
        <label class="tog"><input type="checkbox" id="water"> <span data-t="water"></span></label>
        <label class="tog"><input type="checkbox" id="spin"> <span data-t="spin"></span></label>
        <label class="tog" id="linkTog" hidden><input type="checkbox" id="link" checked> <span data-t="link"></span></label>
      </div>
      </details>
    </div>
    <div class="thint" id="tHint"></div>
    <div class="legend" id="legend"></div>
    <div class="slots" id="slots"></div>
  </main>

  <section class="info" id="infoCol">
    <button class="pclose" id="infoClose" type="button">»</button>
    <button class="rail" id="infoRail" type="button"><span>«</span><b></b></button>
    <div id="info"></div>
  </section>
</div>

<script type="module">
  /* Online (Firebase) laadt één gebundeld bestand in plaats van alle losse modules: bij sommige browsers bleven er
   * af en toe enkele van de ~200 verzoeken eeuwig hangen, en dan bleef het laadscherm staan (tools/bundle.mjs).
   * Lokaal en op GitHub Pages: de losse bestanden, zoals altijd. */
  const online = /(^|\.)(dogma-bio|van-dna-tot-eiwit)\.(web\.app|firebaseapp\.com)$/.test(location.hostname);
  import(online ? './atlas.bundle.js' : './atlas.js');
</script>
</body>
</html>
